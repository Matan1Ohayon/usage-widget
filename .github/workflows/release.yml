name: Release

# Every push to main: run all tests, then bump the version and publish a GitHub release with both installers.
#   - default: patch bump (1.0.3 → 1.0.4)
#   - "#minor" or "#major" anywhere in the pushed commit messages: minor / major bump
#   - "[skip release]" in the last commit message: tests only, no new version
# "Run workflow" on the Actions tab does the same with an explicit bump.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# Releases run one at a time, so two quick pushes can't claim the same version number.
# If several pushes queue up while one is releasing, only the newest waits; it ships all their commits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    name: Next version
    needs: test
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history, to find the last release
      - id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: Build macOS app
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build universal app (Apple Silicon + Intel)
        run: macos/scripts/build-app.sh --universal --version "${{ needs.version.outputs.version }}"
      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent "macos/build/AI Usage.app" AI-Usage-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: AI-Usage-macOS.zip

  windows:
    name: Build Windows app
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish single self-contained .exe
        working-directory: windows
        shell: bash
        run: >
          dotnet publish src/AIUsage -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -p:Version="${{ needs.version.outputs.version }}" -o publish
      - name: Rename
        shell: bash
        run: mv windows/publish/AIUsage.exe AI-Usage-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: AI-Usage-Windows-x64.exe

  release:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: "{macos,windows}"
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AI Usage ${{ needs.version.outputs.version }}
          files: |
            dist/AI-Usage-macOS.zip
            dist/AI-Usage-Windows-x64.exe
          body_path: docs/release-notes.md
          generate_release_notes: true
          make_latest: true
